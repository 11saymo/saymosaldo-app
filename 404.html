<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0d0e0d">
<title>Страница не найдена — SaymoSaldo</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f3;--fg:#171717;--mut:#666;--card:#fff;--line:#e4e4e0;--accent:#7a1f2b}
@media(prefers-color-scheme:dark){:root{--bg:#0d0e0d;--fg:#f0f0ec;--mut:#a1a39e;--card:#161816;--line:#262826;--accent:#e0707d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 10% 0%,rgba(122,31,43,.12),transparent 48%),var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,480px);padding:32px 24px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px}
.mark{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:clamp(30px,8vw,44px);line-height:1.1;margin:18px 0 10px}
p{color:var(--mut);margin:0 0 24px}
a{display:inline-block;padding:12px 20px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:650;text-decoration:none}
</style>
</head>
<body>
<main>
<div class="mark">SaymoSaldo</div>
<h1>Страница не найдена</h1>
<p>Похоже, такой страницы нет или ссылка устарела. Вернитесь на главную — ваши финансы под контролем.</p>
<a href="./">На главную</a>
</main>
</body>
</html>
