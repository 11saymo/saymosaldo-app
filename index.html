<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SaymoSaldo — учёт расходов, бюджета и долгов. Данные хранятся на вашем устройстве.">
<meta name="theme-color" content="#0d0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SaymoSaldo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SaymoSaldo</title>
<script>try{var t=localStorage.getItem('saymosaldo_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f5f5f3;--card:#fff;--fg:#121212;--mut:#6e6e6a;--line:#e4e4e0;--acc:#7a1f2b;--warn:#b26a00;--bad:#b42318;--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0e0d;--card:#161816;--fg:#f0f0ec;--mut:#8d8f8a;--line:#262826;--acc:#e0707d;--warn:#e9a23b;--bad:#f07167;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d0e0d;--card:#161816;--fg:#f0f0ec;--mut:#8d8f8a;--line:#262826;--acc:#e0707d;--warn:#e9a23b;--bad:#f07167;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 110px)}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;gap:12px}
h1{font-size:26px;font-weight:650;letter-spacing:-.02em}
h2{font-size:15px;font-weight:600}
.muted,small,.label{color:var(--mut);font-size:13px}
.label{display:block;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.list{display:grid;gap:8px}
.list .card{margin:0}
.big{font-size:32px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split b{font-variant-numeric:tabular-nums;font-size:17px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px}
.item{display:flex;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item>div:first-child{display:grid;min-width:0}
.item b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right;display:grid;justify-items:end;gap:4px}
.pos{color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row.end{justify-content:flex-end}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar i.warn{background:var(--warn)}
.bar i.over{background:var(--bad)}
.bl{margin:14px 0}
.bl .row span{font-size:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;padding:11px 16px;border:1px solid var(--line);background:var(--card);font-weight:500}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600;width:100%}
.ghost{background:transparent}
.danger{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--mut);font-size:13px;text-decoration:underline;text-underline-offset:3px;border-radius:0}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{padding:8px 12px;font-size:13px;flex:1 1 auto}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--mut)}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;appearance:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px;background:var(--bg)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px;border-radius:9px;color:var(--mut);cursor:pointer;font-weight:500}
.seg input:checked+span{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.tabs button{white-space:nowrap;padding:8px 14px;font-size:14px;border-radius:999px}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.chip{font-size:13px;padding:7px 12px;border-radius:999px}
.chat{display:grid;gap:8px;max-height:44vh;overflow:auto;margin:12px 0}
.msg{padding:10px 13px;border-radius:14px;white-space:pre-wrap;max-width:88%;background:var(--card);border:1px solid var(--line);justify-self:start}
.msg.user{justify-self:end;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chatform{display:flex;gap:8px}
.chatform .primary{width:auto}
.empty{color:var(--mut);padding:18px 0;text-align:center;font-size:14px}
.note{color:var(--mut);font-size:13px;margin-top:18px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.toolbar select{width:auto}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;align-items:center;justify-content:space-between}
.nav button{border:0;background:none;padding:8px 4px;font-size:12px;color:var(--mut);flex:1;border-radius:8px}
.nav button[aria-current=page]{color:var(--fg);font-weight:650}
.nav .fab{flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:26px;line-height:1;padding:0;margin:-22px 6px 0}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--fg);width:min(92vw,400px);padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlgf h2{font-size:18px;margin-bottom:16px}
.dlgf .row button{width:auto}
.dlgf .row .primary{width:auto}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;font-size:14px;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hero{background:linear-gradient(135deg,#7a1f2b 0%,#4a0f1a 100%);color:#fff;border:0;padding:20px}
.hero .label,.hero small{color:rgba(255,255,255,.72)}
.hero .split b{color:#fff}
.hero .bar{background:rgba(255,255,255,.2)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .fab svg{stroke:var(--bg);width:24px;height:24px}
.nav button{font-size:11px}
.greet{font-size:15px;color:var(--mut);margin:-6px 0 6px}
.status{color:var(--mut);font-size:15px;margin:0 0 14px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px}
.qbtn{display:grid;justify-items:center;gap:6px;padding:14px 8px;font-size:13px;border-radius:var(--r)}
.qbtn span{font-size:20px;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:130px}
.wd{display:grid;grid-template-rows:1fr auto;gap:6px;justify-items:center;min-height:0}
.wb{height:100%;width:100%;display:flex;align-items:flex-end}
.wb i{display:block;width:100%;border-radius:8px;background:var(--acc)}
.wd small{font-size:11px;color:var(--mut)}
.ico{width:40px;height:40px;border-radius:13px;background:var(--line);display:grid;place-items:center;font-size:19px;flex:none;margin-right:12px}
.ring{width:46px;height:46px;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:3.4}
.ring .rt{stroke:var(--line)}
.ring .rv{stroke:var(--acc);stroke-linecap:round}
.ringbox{position:relative;width:46px;height:46px;margin-right:12px;flex:none}
.ringbox span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;z-index:80}
.ov-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:360px;width:100%}
.ov-card h2{font-size:20px;margin-bottom:8px}
.ov-card p{margin-bottom:18px}
.tour-card{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 92px);max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;z-index:70;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.tour-hl{outline:3px solid var(--acc)!important;outline-offset:4px;border-radius:12px}

/* SaymoSaldo experience refresh */
:root{--r:18px;--shadow:0 8px 28px rgba(24,28,24,.055)}
body{background:radial-gradient(ellipse at 12% 0%,rgba(122,31,43,.055),transparent 34%),var(--bg)}
.app{max-width:1120px;padding:calc(env(safe-area-inset-top) + 30px) 28px calc(env(safe-area-inset-bottom) + 116px)}
.top{margin-bottom:26px;align-items:center}
h1{font-size:30px;letter-spacing:-.035em}
.card,.item{border-radius:18px;box-shadow:var(--shadow)}
.card{padding:20px}
.hero{padding:26px;background:linear-gradient(125deg,#852d3a 0%,#5a1724 58%,#3e1420 100%);box-shadow:0 14px 34px rgba(92,23,36,.18)}
.hero .big{font-size:clamp(34px,4vw,46px);margin:8px 0 18px}
.hero .split b{font-size:19px}
.greet{font-size:16px;margin:-14px 0 2px;color:var(--mut)}
.status{padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:0 0 8px;align-self:end}
.quick{gap:12px}
.qbtn{min-height:88px;background:var(--card);box-shadow:var(--shadow);transition:transform .16s,border-color .16s}
.qbtn:active{transform:translateY(1px)}
.qbtn span{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:rgba(122,31,43,.09);color:var(--acc)}
.sec{margin:18px 0 8px}
.sec h2{font-size:16px;letter-spacing:-.01em}
.week{height:150px}
.wb i{min-height:5px}
.nav{max-width:1120px;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -8px 28px rgba(20,20,20,.06);padding:10px 18px calc(env(safe-area-inset-bottom) + 10px)}
.nav button{font-size:12px}
.nav .fab{box-shadow:0 8px 18px rgba(20,20,20,.18)}
button{transition:background .16s,border-color .16s,transform .16s}
button:not(:disabled):active{transform:translateY(1px)}
input,select{border-radius:12px}
.ov-card{padding:28px;border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.22)}
.ov-card h2{font-size:23px;letter-spacing:-.025em}
.ov-card p{line-height:1.6}
@media(min-width:760px){
  .view[data-view=home]:not([hidden]){display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:18px;align-items:start}
  .view[data-view=home]>:nth-child(1),.view[data-view=home]>:nth-child(13){grid-column:1/-1}
  .view[data-view=home]>:nth-child(2),.view[data-view=home]>:nth-child(5),.view[data-view=home]>:nth-child(6){grid-column:1/8}
  .view[data-view=home]>:nth-child(3),.view[data-view=home]>:nth-child(4),.view[data-view=home]>:nth-child(7),.view[data-view=home]>:nth-child(8){grid-column:8/13}
  .view[data-view=home]>:nth-child(9),.view[data-view=home]>:nth-child(10){grid-column:1/7}
  .view[data-view=home]>:nth-child(11),.view[data-view=home]>:nth-child(12){grid-column:7/13}
  .view[data-view=home]>.sec{align-self:end}
}
@media(max-width:759px){
  .app{max-width:560px;padding-left:16px;padding-right:16px}
  h1{font-size:26px}
  .card{padding:16px}
  .hero{padding:20px}
  .hero .big{font-size:34px}
  .nav{max-width:560px;border-radius:0}
}


/* Ambient finance-inspired background: layered color, fine grid and soft rings */
body{position:relative;isolation:isolate;background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(ellipse 620px 500px at 4% 8%,rgba(122,31,43,.13),transparent 72%),
 radial-gradient(ellipse 520px 440px at 96% 18%,rgba(190,151,105,.13),transparent 70%),
 radial-gradient(ellipse 620px 520px at 82% 92%,rgba(122,31,43,.075),transparent 72%),
 linear-gradient(rgba(122,31,43,.025) 1px,transparent 1px),
 linear-gradient(90deg,rgba(122,31,43,.025) 1px,transparent 1px);
 background-size:auto,auto,auto,34px 34px,34px 34px;
 mask-image:linear-gradient(to bottom,black 0%,rgba(0,0,0,.85) 65%,transparent 100%)}
body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:420px;height:420px;right:-190px;top:150px;border:1px solid rgba(122,31,43,.12);border-radius:50%;box-shadow:0 0 0 28px rgba(122,31,43,.025),0 0 0 58px rgba(122,31,43,.02),0 0 0 90px rgba(122,31,43,.015)}
.app{position:relative}
@media(prefers-color-scheme:dark){
 body::before{background:
 radial-gradient(ellipse 620px 500px at 4% 8%,rgba(224,112,125,.14),transparent 72%),
 radial-gradient(ellipse 520px 440px at 96% 18%,rgba(197,151,99,.09),transparent 70%),
 radial-gradient(ellipse 620px 520px at 82% 92%,rgba(224,112,125,.08),transparent 72%),
 linear-gradient(rgba(224,112,125,.035) 1px,transparent 1px),
 linear-gradient(90deg,rgba(224,112,125,.035) 1px,transparent 1px)}
 body::after{border-color:rgba(224,112,125,.15);box-shadow:0 0 0 28px rgba(224,112,125,.035),0 0 0 58px rgba(224,112,125,.025),0 0 0 90px rgba(224,112,125,.018)}
}
:root[data-theme=dark] body::before{background:
 radial-gradient(ellipse 620px 500px at 4% 8%,rgba(224,112,125,.14),transparent 72%),
 radial-gradient(ellipse 520px 440px at 96% 18%,rgba(197,151,99,.09),transparent 70%),
 radial-gradient(ellipse 620px 520px at 82% 92%,rgba(224,112,125,.08),transparent 72%),
 linear-gradient(rgba(224,112,125,.035) 1px,transparent 1px),
 linear-gradient(90deg,rgba(224,112,125,.035) 1px,transparent 1px)}
:root[data-theme=dark] body::after{border-color:rgba(224,112,125,.15);box-shadow:0 0 0 28px rgba(224,112,125,.035),0 0 0 58px rgba(224,112,125,.025),0 0 0 90px rgba(224,112,125,.018)}

</style>
</head>
<body>
<div class="app">
  <header class="top"><h1 id="title">Главная</h1></header>

  <main>
    <section class="view" data-view="home">
      <p class="greet" id="greet"></p>
      <div class="card hero">
        <span class="label" id="monthLabel"></span>
        <div class="big" id="balance">—</div>
        <div class="split">
          <div><span class="label">Доходы</span><b id="income">—</b></div>
          <div><span class="label">Расходы</span><b id="expense">—</b></div>
        </div>
      </div>
      <p class="status" id="status"></p>
      <div class="quick">
        <button class="qbtn" data-go="add"><span>＋</span>Операция</button>
        <button class="qbtn" data-go="stats"><span>◎</span>Бюджет</button>
        <button class="qbtn" data-go="more"><span>↻</span>Платежи</button>
      </div>
      <div class="sec"><h2>Последние 7 дней</h2></div>
      <div class="card"><div class="week" id="week"></div></div>
      <div class="sec"><h2>Лимиты</h2><button class="link" data-go="stats">Управлять</button></div>
      <div id="homeLimits" class="list"></div>
      <div class="sec"><h2>Цели</h2><button class="link" data-go="stats">Управлять</button></div>
      <div id="homeGoals" class="list"></div>
      <div class="sec"><h2>Последние операции</h2><button class="link" data-go="ops">Все</button></div>
      <div id="recent" class="list"></div>
      <p class="note">Данные хранятся в этом браузере. Делайте резервную копию в разделе «Ещё».</p>
    </section>

    <section class="view" data-view="ops" hidden>
      <div class="toolbar">
        <select id="filter" aria-label="Фильтр операций">
          <option value="all">Все</option><option value="expense">Расходы</option><option value="income">Доходы</option>
        </select>
        <small id="count"></small>
      </div>
      <div id="allItems" class="list"></div>
    </section>

    <section class="view" data-view="add" hidden>
      <form id="txForm" class="card">
        <div class="seg">
          <label><input type="radio" name="type" value="expense" checked><span>Расход</span></label>
          <label><input type="radio" name="type" value="income"><span>Доход</span></label>
        </div>
        <label class="field"><span>Сумма, ₽</span><input name="amount" type="number" inputmode="decimal" min="1" step="1" required placeholder="450"></label>
        <label class="field"><span>Категория</span><select name="category" id="txCat"></select></label>
        <label class="field"><span>Дата</span><input name="date" type="date" required></label>
        <label class="field"><span>Комментарий (необязательно)</span><input name="comment" maxlength="80" placeholder="Например, обед"></label>
        <button class="primary">Сохранить</button>
      </form>
    </section>

    <section class="view" data-view="stats" hidden>
      <div id="budgetWrap"></div>
      <div class="sec"><h2>Расходы по категориям</h2></div>
      <div class="card"><div id="catStats"></div></div>
      <div class="sec"><h2>Динамика за 6 месяцев</h2></div>
      <div class="card"><div id="monthStats"></div></div>
    </section>

    <section class="view" data-view="more" hidden>
      <div class="tabs" id="tabs" role="tablist">
        <button data-tab="recurring">Платежи</button>
        <button data-tab="debts">Долги</button>
        <button data-tab="assistant">Помощник</button>
        <button data-tab="settings">Настройки</button><button data-tab="data">Данные</button>
      </div>
      <div id="panel"></div>
    </section>
  </main>
</div>

<nav class="nav" aria-label="Основная навигация">
  <button data-go="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button data-go="ops"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Операции</button>
  <button data-go="add" class="fab" aria-label="Новая операция"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Бюджет</button>
  <button data-go="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Ещё</button>
</nav>

<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='saymosaldo_';
const KEYS=['tx','goals','budgets','recurring','debts'];
const storagePrefix=()=>user?.id?KEY+'user_'+user.id+'_':KEY;
const scopedKey=k=>storagePrefix()+k;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(KEY+k))??d}catch{return d}};
const loadScoped=(prefix,k,d)=>{try{return JSON.parse(localStorage.getItem(prefix+k))??d}catch{return d}};
const S={tx:load('tx',[]),goals:load('goals',[]),budgets:load('budgets',[]),recurring:load('recurring',[]),debts:load('debts',[])};
const save=()=>{if(user&&!accountReady)return;for(const k of KEYS)localStorage.setItem(scopedKey(k),JSON.stringify(S[k]));if(user&&accountReady){accountHasData=stateHasData(S);scheduleSync()}};
const CATS={expense:['Продукты','Кафе и рестораны','Транспорт','Покупки','Дом','Здоровье','Развлечения','Подписки','Кредиты и долги','Другое'],income:['Зарплата','Подработка','Подарок','Другое']};
const DEBT_KINDS=['Ипотека','Кредит','Кредитная карта','Рассрочка','Частный долг'];
const ymd=d=>d.toLocaleDateString('en-CA');
const today=()=>ymd(new Date()), nowMk=()=>today().slice(0,7);
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(+n||0)+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>new Date(s+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const monthName=k=>new Date(k+'-15T12:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
const total=a=>a.reduce((v,x)=>v+(+x||0),0);
const sumType=(a,t)=>total(a.filter(x=>x.type===t).map(x=>x.amount));
const monthTx=k=>S.tx.filter(x=>String(x.date).slice(0,7)===k);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const empty=t=>`<div class="empty">${t}</div>`;
const catOpts=t=>CATS[t].map(c=>`<option>${esc(c)}</option>`).join('');
const field=(n,l,t='number',x='')=>`<label class="field"><span>${l}</span><input name="${n}" type="${t}" ${t==='number'?'inputmode="decimal" step="any"':''} ${x}></label>`;
let mode='finance', tab='recurring', cur='home';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)}

const TITLES={home:'Главная',ops:'Операции',add:'Новая операция',stats:'Бюджет',more:'Ещё'};
function go(p){
  cur=p;
  $$('.view').forEach(v=>v.hidden=v.dataset.view!==p);
  $$('.nav [data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===p?'page':'false'));
  $('#title').textContent=TITLES[p];
  if(p==='add'){$('#txForm [name=date]').value=today();fillTx()}
  window.scrollTo(0,0);
  render();
}

function ask(title,fields,cb){
  const d=$('#dlg');
  d.innerHTML=`<form class="dlgf"><h2>${esc(title)}</h2>${fields.map(f=>field(f.n,f.l,'number',`value="${esc(f.v??'')}" required`)).join('')}<p class="err" id="dlgErr"></p><div class="row end"><button type="button" data-act="dlg-cancel">Отмена</button><button class="primary">Сохранить</button></div></form>`;
  d.querySelector('form').addEventListener('submit',e=>{
    e.preventDefault();
    const err=cb(Object.fromEntries(new FormData(e.target)));
    if(err){$('#dlgErr').textContent=err;return}
    d.close();
  });
  d.showModal();
}

const ICON={'Продукты':'🛒','Кафе и рестораны':'☕','Транспорт':'🚌','Покупки':'🛍️','Дом':'🏠','Здоровье':'💊','Развлечения':'🎬','Подписки':'📺','Кредиты и долги':'🏦','Зарплата':'💼','Подработка':'🛠️','Подарок':'🎁'};
const items=(list,del)=>list.map(x=>`<div class="item"><div style="display:flex;align-items:center;min-width:0"><span class="ico">${ICON[x.category]||'📦'}</span><div style="min-width:0"><b>${esc(x.comment||x.category)}</b><small>${x.comment?esc(x.category)+' · ':''}${fmtDate(x.date)}</small></div></div><div class="amt ${x.type==='income'?'pos':''}">${x.type==='income'?'+':'−'}${money(x.amount)}${del?`<button class="link" data-act="tx-del" data-id="${esc(x.id)}">Удалить</button>`:''}</div></div>`).join('');
const bar=(l,v,max)=>`<div class="bl"><div class="row"><span>${esc(l)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${Math.max(2,v/max*100)}%"></i></div></div>`;
const goalCard=(g,compact)=>{const p=g.target?Math.min(100,g.saved/g.target*100):0;return `<div class="card"><div class="row"><b>${esc(g.name)}</b><small>${Math.round(p)}%</small></div><small>${money(g.saved)} из ${money(g.target)}${g.date?' · до '+fmtDate(g.date):''}</small><div class="bar"><i style="width:${p}%"></i></div>${compact?'':`<div class="actions"><button class="ghost" data-act="goal-fund" data-id="${esc(g.id)}">Пополнить</button><button class="ghost danger" data-act="goal-del" data-id="${esc(g.id)}">Удалить</button></div>`}</div>`};

function render(){
  const k=nowMk(), m=monthTx(k), inc=sumType(m,'income'), out=sumType(m,'expense');
  const spent=c=>total(m.filter(x=>x.type==='expense'&&x.category===c).map(x=>x.amount));
  const overN=S.budgets.filter(b=>spent(b.category)>b.limit).length;
  const h=new Date().getHours();
  $('#greet').textContent=(h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер')+', рады видеть вас в SaymoSaldo!';
  $('#monthLabel').textContent=monthName(k);
  $('#balance').textContent=money(inc-out);
  $('#income').textContent=money(inc);
  $('#expense').textContent=money(out);
  $('#status').textContent=!S.tx.length?'Добавьте первую операцию, и картина месяца появится здесь.':overN?`Превышено лимитов: ${overN}. Проверьте категории ниже.`:'Всё под контролем.';
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(ymd(d))}
  const dv=days.map(dd=>S.tx.filter(x=>x.type==='expense'&&x.date===dd).reduce((v,x)=>v+(+x.amount||0),0));
  const wmax=Math.max(...dv,1);
  $('#week').innerHTML=days.map((dd,i)=>`<div class="wd"><div class="wb"><i style="height:${Math.max(4,dv[i]/wmax*100)}%"></i></div><small>${new Date(dd+'T12:00').toLocaleDateString('ru-RU',{weekday:'short'}).slice(0,2)}</small></div>`).join('');
  const sorted=[...S.tx].sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.created||0)-(a.created||0));
  $('#recent').innerHTML=items(sorted.slice(0,3),false)||empty('Операций пока нет. Добавьте первую — это займёт минуту.');
  const f=$('#filter').value, list=sorted.filter(x=>f==='all'||x.type===f);
  $('#count').textContent=list.length+' шт.';
  $('#allItems').innerHTML=items(list,true)||empty('Нет операций по выбранному фильтру.');
  const ring=p=>`<svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" class="rt"/><circle cx="18" cy="18" r="15.9" class="rv" stroke-dasharray="${Math.min(100,p)} 100"/></svg>`;
  $('#homeGoals').innerHTML=S.goals.slice(0,3).map(g=>{const p=g.target?Math.min(100,g.saved/g.target*100):0;return `<div class="item"><div style="display:flex;align-items:center;min-width:0"><div class="ringbox">${ring(p)}<span>${Math.round(p)}%</span></div><div style="min-width:0"><b>${esc(g.name)}</b><small>${money(g.saved)} из ${money(g.target)}</small></div></div></div>`}).join('')||empty('Цели пока не добавлены.');
  $('#homeLimits').innerHTML=S.budgets.slice(0,3).map(b=>{const sp=spent(b.category),p=b.limit?sp/b.limit*100:0,cl=p>=100?'over':p>=80?'warn':'';return `<div class="card"><div class="row"><b>${esc(b.category)}</b><small>${money(sp)} из ${money(b.limit)}</small></div><div class="bar"><i class="${cl}" style="width:${Math.min(100,p)}%"></i></div></div>`}).join('')||empty('Лимиты не установлены. Их можно задать в разделе «Бюджет».');
  const by={};
  m.filter(x=>x.type==='expense').forEach(x=>by[x.category]=(by[x.category]||0)+(+x.amount||0));
  const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]), max=ents[0]?.[1]||1;
  $('#catStats').innerHTML=ents.map(([c,v])=>bar(c,v,max)).join('')||empty('Добавьте расходы — здесь появится разбивка по категориям.');
  const ks=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ks.push(ymd(d).slice(0,7))}
  const vals=ks.map(q=>sumType(monthTx(q),'expense')), mx=Math.max(...vals,1);
  $('#monthStats').innerHTML=ks.map((q,i)=>bar(monthName(q),vals[i],mx)).join('');
  $('#budgetWrap').innerHTML=PANELS.goals()+PANELS.budgets();
  renderPanel();
 }

    <form class="card" data-form="goal">${field('name','Название','text','required placeholder="Отпуск"')}${field('target','Сумма цели, ₽','number','required min="1"')}${field('saved','Уже отложено, ₽','number','min="0"')}${field('date','Срок (необязательно)','date')}<button class="primary">Создать цель</button></form>`,

  },

    <div class="sec"><h2>Новый платёж</h2></div>
    <form class="card" data-form="rec">${field('name','Название','text','required placeholder="Интернет"')}${field('amount','Сумма, ₽','number','required min="1"')}<label class="field"><span>Категория</span><select name="category">${catOpts('expense')}</select></label>${field('day','День месяца (1–31)','number','required min="1" max="31"')}<button class="primary">Добавить</button></form>`;
  },

    return `<div class="card"><span class="label">Общий остаток долгов</span><div class="big">${money(rem)}</div><small>Каждый закрытый платёж — шаг вперёд. Сравнивать свой путь с чужим не нужно.</small></div>
    ${S.debts.map(d=>{const rm=+d.remaining||0,o=Math.max(+d.original||0,rm),pd=Math.max(0,o-rm),p=o?pd/o*100:0;return `<div class="card"><div class="row"><b>${esc(d.name)}</b><b>${money(rm)}</b></div><small>${esc(d.kind)} · платёж ${money(d.monthly)} · ${d.day}-го${d.rate?` · ${esc(d.rate)}% годовых`:''}</small><div class="bar"><i style="width:${p}%"></i></div><small>${Math.round(p)}% · погашено ${money(pd)} из ${money(o)}</small><div class="actions"><button class="ghost" data-act="debt-pay" data-id="${esc(d.id)}"${rm<=0?' disabled':''}>Отметить платёж</button><button class="ghost danger" data-act="debt-del" data-id="${esc(d.id)}">Удалить</button></div></div>`}).join('')||empty('Здесь появится общий остаток, когда вы добавите обязательство.')}

  settings:()=>{const cur=document.documentElement.dataset.theme||'auto';return `${accountCard()}<div class="card"><h2>Обучение</h2><p class="muted" style="margin:6px 0 12px">Короткий обзор основных разделов.</p><button class="ghost" data-act="tour-start">Показать обучение</button></div><div class="card"><h2>Оформление</h2><p class="muted" style="margin:6px 0 14px">Тема сохраняется на этом устройстве.</p><div class="tabs" style="margin:0">${[['light','Светлая'],['dark','Тёмная'],['auto','Как в телефоне']].map(([v,l])=>`<button data-theme-set="${v}" aria-selected="${cur===v}">${l}</button>`).join('')}</div></div>`},
  data:()=>`<div class="card"><p>Резервная копия содержит операции, цели, лимиты, платежи и долги. Файл содержит ваши финансовые записи, не передавайте его посторонним.</p>
    <div class="actions"><button class="primary" data-act="export">Скачать копию</button><button data-act="import">Восстановить из копии</button></div></div>
    <p class="note">Данные хранятся только в этом браузере. Очистка данных сайта может их удалить, поэтому делайте копию регулярно. Не вводите пароли, коды подтверждения и номера карт.</p>`
};

function renderPanel(){
  $$('#tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('#panel').innerHTML=PANELS[tab]();
  if(tab==='assistant')renderChat();
}

const FORMS={
  goal(d){const name=d.name.trim(),target=Math.round(+d.target),saved=Math.round(+d.saved||0);if(!name||!(target>0))return'Укажите название и сумму цели.';if(saved<0)return'Сумма не может быть отрицательной.';S.goals.push({id:uid(),name,target,saved,date:d.date||''});toast('Цель создана')},
  budget(d){const limit=Math.round(+d.limit);if(!(limit>0))return'Укажите лимит больше нуля.';const b=S.budgets.find(x=>x.category===d.category);if(b)b.limit=limit;else S.budgets.push({category:d.category,limit});toast('Лимит сохранён')},
  rec(d){const name=d.name.trim(),amount=Math.round(+d.amount),day=Math.round(+d.day);if(!name||!(amount>0))return'Укажите название и сумму.';if(!(day>=1&&day<=31))return'День — от 1 до 31.';S.recurring.push({id:uid(),name,amount,category:d.category,day});toast('Платёж добавлен')},
  debt(d){const name=d.name.trim(),original=Math.round(+d.original),remaining=Math.round(+d.remaining),monthly=Math.round(+d.monthly),day=Math.round(+d.day),rate=d.rate===''?null:+d.rate;if(!name)return'Укажите название.';if(!(original>0))return'Первоначальная сумма должна быть больше нуля.';if(!(remaining>=0&&remaining<=original))return'Остаток должен быть от 0 до первоначальной суммы.';if(!(monthly>0))return'Укажите ежемесячный платёж.';if(!(day>=1&&day<=31))return'День — от 1 до 31.';if(rate!==null&&!(rate>=0&&rate<=100))return'Ставка — от 0 до 100.';S.debts.push({id:uid(),kind:d.kind,name,original,remaining,monthly,day,rate,history:[]});toast('Обязательство добавлено')},
  login(d){sendLink(d.email)},
  chat(d){askAssistant(d.q)}
};

document.addEventListener('submit',e=>{
  if(user&&!accountReady){e.preventDefault();return}
  const f=e.target.dataset.form;
  if(!f)return;
  e.preventDefault();
  const err=FORMS[f](Object.fromEntries(new FormData(e.target)));
  if(err)return toast(err);
  e.target.reset();
  save();
  render();
});

function fillTx(){$('#txCat').innerHTML=catOpts(document.querySelector('#txForm [name=type]:checked').value)}
$('#txForm').addEventListener('change',fillTx);
$('#txForm').addEventListener('submit',e=>{
  e.preventDefault();
  if(user&&!accountReady)return;
  const f=e.target,d=Object.fromEntries(new FormData(f)),amount=Math.round(+d.amount);
  if(!(amount>0))return toast('Укажите сумму больше нуля.');
  if(!d.date)return toast('Укажите дату.');
  S.tx.push({id:uid(),created:Date.now(),type:d.type,amount,category:d.category,date:d.date,comment:(d.comment||'').trim().slice(0,80)});
  save();
  f.reset();
  fillTx();
  toast('Операция сохранена');
  go('home');
});

function payRecurring(id){
  const r=S.recurring.find(x=>x.id===id);if(!r)return;
  const key=scopedKey('paid_'+nowMk()+'_'+id);
  if(localStorage.getItem(key))return toast('Этот платёж уже отмечен в этом месяце');
  const dt=new Date(),last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();
  const date=nowMk()+'-'+String(Math.min(r.day,last)).padStart(2,'0');
  S.tx.push({id:uid(),created:Date.now(),type:'expense',amount:r.amount,category:r.category,date,comment:r.name});
  localStorage.setItem(key,'1');save();toast('Расход добавлен в историю');render();
}

function payDebt(id){
  const d=S.debts.find(x=>x.id===id);if(!d)return;
  ask('Платёж по обязательству',[{n:'paid',l:'Сколько заплатили, ₽',v:d.monthly},{n:'principal',l:'На сколько уменьшился основной долг, ₽ (если не знаете, оставьте 0)',v:0}],f=>{
    const paid=Math.round(+f.paid),pr=Math.round(+f.principal||0);
    if(!(paid>0))return'Укажите сумму платежа.';
    if(pr<0||pr>paid)return'Основной долг не может быть больше платежа.';
    if(pr>d.remaining)return'Сумма больше остатка долга.';
    const date=today();
    S.tx.push({id:uid(),created:Date.now(),type:'expense',amount:paid,category:'Кредиты и долги',date,comment:'Платёж: '+d.name});
    d.remaining-=pr;
    d.history=[...(d.history||[]),{date,amount:paid,principal:pr}];
    save();render();
    toast(d.remaining===0?'Обязательство полностью погашено':'Платёж записан. Остаток уменьшен только на указанную сумму основного долга.');
  });
}

function exportData(){
  const data={app:'SaymoSaldo',version:4,exportedAt:new Date().toISOString(),...S};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=`SaymoSaldo-backup-${today()}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importData(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch{return toast('Файл повреждён или не является JSON')}
    if(!['tx','goals','budgets','recurring'].every(k=>Array.isArray(d[k])))return toast('Это не резервная копия SaymoSaldo');
    if(!confirm('Заменить текущие данные данными из копии?'))return;
    S.tx=d.tx;S.goals=d.goals;S.budgets=d.budgets;S.recurring=d.recurring;S.debts=Array.isArray(d.debts)?d.debts:[];
    save();render();toast('Данные восстановлены');
  };
  r.readAsText(f);
}

const chatKey=()=>scopedKey('chat_'+mode);
function loadChatItems(){try{return JSON.parse(localStorage.getItem(chatKey()))||[]}catch{return[]}}
function renderChat(){
  const el=$('#chat');if(!el)return;
  const list=loadChatItems();
  el.innerHTML=list.map(m=>`<div class="msg ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')||empty('Спросите, например, на что уходит больше всего денег.');
  el.scrollTop=el.scrollHeight;
}
function askAssistant(q){
  q=(q||'').trim();if(!q)return;
  const list=loadChatItems();
  list.push({role:'user',text:q},{role:'assistant',text:finance(q)});
  localStorage.setItem(chatKey(),JSON.stringify(list.slice(-60)));
  renderChat();
}

function finance(q){
  if(!S.tx.length)return'Пока нет операций. Добавьте доходы и расходы, и я смогу показать наблюдения.';
  const m=monthTx(nowMk()),exp=m.filter(x=>x.type==='expense');
  const by={};exp.forEach(x=>by[x.category]=(by[x.category]||0)+(+x.amount||0));
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const pd=new Date();pd.setDate(1);pd.setMonth(pd.getMonth()-1);
  const prev=sumType(monthTx(ymd(pd).slice(0,7)),'expense'), cur=sumType(m,'expense');
  const over=S.budgets.filter(b=>(by[b.category]||0)>b.limit);
  const s=q.toLowerCase();
  if(/трач|категор|больше/.test(s))return top.length?`В этом месяце больше всего расходов в категории «${top[0][0]}»: ${money(top[0][1])}.`:'В этом месяце расходов пока нет.';
  if(/изменил|сравн|прошл/.test(s))return prev?`В этом месяце расходы составили ${money(cur)}, в прошлом — ${money(prev)}.`:`В этом месяце расходы составили ${money(cur)}. Данных за прошлый месяц пока нет.`;
  if(/лимит|превыш/.test(s))return over.length?'Превышены лимиты: '+over.map(b=>`«${b.category}»`).join(', ')+'.':'В этом месяце превышений лимитов нет.';
  if(/совет|эконом/.test(s))return top.length?`Чаще всего деньги уходят в «${top[0][0]}». Можно установить лимит на эту категорию в разделе «Лимиты».`:'Добавьте расходы, и я подскажу, где можно сократить.';
  return'Могу ответить на вопросы: на что больше всего трачу, как изменились расходы, какие лимиты превышены, и дать совет по экономии.';
}

const SB_URL='https://pmrrslmkrulhuapxtltm.supabase.co';
const SB_KEY='sb_publishable_yqDwOCq3n3rZ7E0WOMLUtg_84VOefBt';
let sb=null, user=null, syncTimer=null, accountReady=false, syncAllowed=false, accountHasData=false, authGeneration=0;
const emptyState=()=>({tx:[],goals:[],budgets:[],recurring:[],debts:[]});
const stateHasData=d=>KEYS.some(k=>Array.isArray(d[k])&&d[k].length>0);
function applyState(d){KEYS.forEach(k=>S[k]=Array.isArray(d[k])?d[k]:[])}
function readLocalState(prefix){const d={};KEYS.forEach(k=>d[k]=loadScoped(prefix,k,[]));return d}
function writeLocalState(prefix){KEYS.forEach(k=>localStorage.setItem(prefix+k,JSON.stringify(S[k])))}
function guestHasData(){return stateHasData(readLocalState(KEY))}
function initSB(){
  if(!window.supabase){renderPanel();return}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  sb.auth.onAuthStateChange((_event,session)=>{
    const nextUser=(session&&session.user)||null;
    if((nextUser?.id||null)===(user?.id||null)&&accountReady)return;
    user=nextUser;
    accountReady=false;
    const generation=++authGeneration;
    clearTimeout(syncTimer);
    syncTimer=null;
    renderPanel();
    setTimeout(()=>activateAccount(nextUser,generation),0);
  });
}
async function activateAccount(nextUser,generation){
  if(!nextUser){
    applyState(readLocalState(KEY));
    accountHasData=false;
    syncAllowed=false;
    accountReady=true;
    render();renderPanel();
    return;
  }
  const prefix=KEY+'user_'+nextUser.id+'_';
  applyState(emptyState());
  try{
    const {data,error}=await sb.from('user_data').select('data').eq('user_id',nextUser.id).maybeSingle();
    if(generation!==authGeneration)return;
    if(error)throw error;
    const remote=(data&&data.data)||{};
    const remoteHasState=KEYS.some(k=>Array.isArray(remote[k]));
    if(remoteHasState){
      applyState(remote);
      accountHasData=stateHasData(remote);
    }else{
      const cached=readLocalState(prefix);
      if(stateHasData(cached))applyState(cached);
      else applyState(emptyState());
      accountHasData=stateHasData(cached);
    }
    writeLocalState(prefix);
    syncAllowed=true;
    accountReady=true;
    render();renderPanel();
    if(accountHasData)toast('Данные вашего аккаунта загружены');
    else if(guestHasData())toast('Данные этого устройства не переносились. Их можно перенести отдельно.');
  }catch(error){
    if(generation!==authGeneration)return;
    applyState(readLocalState(prefix));
    accountHasData=stateHasData(S);
    syncAllowed=false;
    accountReady=true;
    render();renderPanel();
    toast('Не удалось загрузить облачные данные. Изменения пока не синхронизируются.');
  }
}
function scheduleSync(){
  if(!sb||!user||!accountReady||!syncAllowed)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushRemote,800);
}
async function pushRemote(){
  if(!sb||!user||!accountReady||!syncAllowed)return;
  const uid=user.id;
  const payload={};KEYS.forEach(k=>payload[k]=S[k]);
  const {error}=await sb.from('user_data').upsert({user_id:uid,data:payload,updated_at:new Date().toISOString()});
  if(uid!==user?.id)return;
  if(error)toast('Не удалось сохранить в облако. Данные остались на этом устройстве.');
  else accountHasData=stateHasData(payload);
}
async function sendLink(email){
  if(!sb){toast('Вход пока не настроен');return}
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0],shouldCreateUser:true}});
  toast(error?'Не удалось отправить ссылку: '+error.message:'Ссылка отправлена на почту. Проверьте также папку «Спам».');
}
async function logout(){
  if(!sb)return;
  const {error}=await sb.auth.signOut({scope:'local'});
  if(error){toast('Не удалось выйти из аккаунта: '+error.message);return}
  toast('Вы вышли из аккаунта');
}
function accountCard(){
  if(user)return '<div class="card"><h2>Аккаунт</h2><p class="muted" style="margin:6px 0 12px">Вы вошли как '+esc(user.email)+'. Данные этого аккаунта отделены от данных на устройстве.</p>'+(accountReady&&syncAllowed&&!accountHasData&&guestHasData()?'<button class="ghost" data-act="import-device-data">Перенести данные с этого устройства в аккаунт</button>':'')+'<button class="ghost" data-act="logout">Выйти</button></div>';
  return '<div class="card"><h2>Аккаунт</h2><p class="muted" style="margin:6px 0 12px">Войдите, чтобы данные были на всех ваших устройствах. Пароль не нужен: пришлём ссылку на почту.</p><form class="chatform" data-form="login"><input name="email" type="email" required placeholder="you@example.com" autocomplete="email"><button class="primary">Получить ссылку</button></form></div>';
}
const TOUR=[
 {view:'home',sel:'#balance',t:'Главная',x:'Здесь видно баланс месяца, доходы и расходы. Всё обновляется сразу после записи операции.'},
 {view:'home',sel:'nav button[data-go="add"]',t:'Новая операция',x:'Нажмите «+», чтобы записать трату или доход. Укажите сумму и категорию, дата подставится сама.'},
 {view:'ops',sel:'#allItems',t:'Операции',x:'Здесь все записи. Фильтр покажет только расходы или только доходы, а лишнюю операцию можно удалить.'},
 {view:'stats',sel:'#budgetWrap',t:'Бюджет',x:'Цели накопления и лимиты по категориям. Лимит подскажет, когда категория близка к пределу.'},
 {view:'more',tab:'recurring',sel:'#panel',t:'Платежи',x:'Аренда, интернет, подписки. Отмечайте оплату, и расход сразу появится в истории.'},
 {view:'more',tab:'debts',sel:'#panel',t:'Долги',x:'Ипотека и кредиты: видно остаток и процент погашения. Каждый платёж уменьшает долг.'},
 {view:'more',tab:'data',sel:'#panel',t:'Данные и вход',x:'Сохраняйте резервную копию в разделе «Данные». Войдите по email в «Настройках», чтобы данные были на всех устройствах.'}
];
let tourI=0;
function showWelcome(){
  const d=document.createElement('div');d.id='welcome';d.className='overlay';
  d.innerHTML='<div class="ov-card"><div style="font-size:34px;margin-bottom:12px">✦</div><h2>Добро пожаловать в SaymoSaldo!</h2><p class="muted">Ваш спокойный и понятный помощник для управления личными финансами. Записывайте расходы, планируйте бюджет, следите за целями и платежами — всё в одном месте.</p><p class="muted">Хотите пройти короткое знакомство? Покажем основные разделы примерно за минуту. Его можно открыть позже в настройках.</p><div style="display:grid;gap:8px"><button class="primary" data-act="welcome-yes">Показать, как всё устроено</button><button class="ghost" data-act="welcome-no">Перейти к приложению</button></div></div>';
  document.body.appendChild(d);
}
function closeWelcome(){document.getElementById('welcome')?.remove()}
function startTour(){closeWelcome();tourI=0;showTourStep()}
function showTourStep(){
  document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));
  const st=TOUR[tourI]; if(st.tab)tab=st.tab;
  go(st.view);
  const el=document.querySelector(st.sel);
  if(el){el.classList.add('tour-hl');el.scrollIntoView({block:'center'})}
  let c=document.getElementById('tour');
  if(!c){c=document.createElement('div');c.id='tour';c.className='tour-card';document.body.appendChild(c)}
  const last=tourI===TOUR.length-1;
  c.innerHTML=`<small class="muted">Шаг ${tourI+1} из ${TOUR.length}</small><h2 style="font-size:17px;margin:4px 0 6px">${st.t}</h2><p style="margin-bottom:14px">${st.x}</p><div class="row"><button class="link" data-act="tour-skip">Пропустить</button><div style="display:flex;gap:8px">${tourI>0?'<button class="ghost" data-act="tour-back">Назад</button>':''}<button class="primary" data-act="tour-next" style="width:auto">${last?'Готово':'Дальше'}</button></div></div>`;
}
function endTour(state){
  try{localStorage.setItem(KEY+'onboarding',state)}catch(e){}
  document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));
  document.getElementById('tour')?.remove();
}
function setTheme(v){try{localStorage.setItem('saymosaldo_theme',v)}catch(e){}if(v==='light'||v==='dark')document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme}
document.addEventListener('click',e=>{
  if(user&&!accountReady)return;
  const t=e.target.closest('[data-go],[data-tab],[data-mode],[data-q],[data-act],[data-theme-set]');
  if(!t)return;
  if(t.dataset.themeSet){setTheme(t.dataset.themeSet);return renderPanel()}
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.tab){tab=t.dataset.tab;return renderPanel()}
  if(t.dataset.mode){mode=t.dataset.mode;return renderPanel()}
  if(t.dataset.q)return askAssistant(t.dataset.q);
  const id=t.dataset.id,act=t.dataset.act;
  const confirmDo=(msg,fn)=>{if(confirm(msg)){fn();save();render()}};
  switch(act){
    case'tx-del':return confirmDo('Удалить операцию?',()=>{S.tx=S.tx.filter(x=>String(x.id)!==id)});
    case'goal-fund':return ask('Пополнить цель',[{n:'amount',l:'Сумма, ₽'}],f=>{
      const v=Math.round(+f.amount),g=S.goals.find(x=>x.id===id);
      if(!g)return'Цель не найдена.';
      if(!(v>0))return'Введите сумму больше нуля.';
      g.saved+=v;save();render();toast('Цель пополнена');
    });
    case'goal-del':return confirmDo('Удалить цель?',()=>{S.goals=S.goals.filter(x=>x.id!==id)});
    case'budget-del':return confirmDo('Удалить лимит?',()=>{S.budgets=S.budgets.filter(x=>x.category!==t.dataset.cat)});
    case'rec-pay':return payRecurring(id);
    case'rec-del':return confirmDo('Удалить регулярный платёж?',()=>{S.recurring=S.recurring.filter(x=>x.id!==id)});
    case'debt-pay':return payDebt(id);
    case'debt-del':return confirmDo('Удалить обязательство? История расходов останется.',()=>{S.debts=S.debts.filter(x=>x.id!==id)});
    case'chat-clear':if(confirm('Очистить историю этого режима на этом устройстве?')){localStorage.removeItem(chatKey());renderChat()}return;
    case'welcome-yes':return startTour();
    case'welcome-no':try{localStorage.setItem(KEY+'onboarding','skipped')}catch(e){}closeWelcome();return;
    case'tour-start':return startTour();
    case'tour-next':if(tourI<TOUR.length-1){tourI++;return showTourStep()}return endTour('done');
    case'tour-back':tourI--;return showTourStep();
    case'tour-skip':return endTour('skipped');
    case'logout':return logout();
    case'import-device-data':
      if(!user||!accountReady||!syncAllowed||accountHasData||!guestHasData())return;
      if(!confirm('Перенести локальные данные в пустой аккаунт? Данные аккаунта будут заменены данными этого устройства.'))return;
      applyState(readLocalState(KEY));
      save();render();renderPanel();toast('Данные перенесены. Дождитесь завершения синхронизации.');
      return;
    case'export':return exportData();
    case'import':return $('#importFile').click();
    case'dlg-cancel':return $('#dlg').close();
  }
});

document.addEventListener('change',e=>{if(e.target.id==='importFile')importData(e)});

fillTx();
initSB();
go('home');
if(!localStorage.getItem(KEY+'onboarding'))showWelcome();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
