name: SaymoSaldo quality checks

on:
  push:
    branches:
      - main
      - quality-foundation
      - "feature/**"
      - "audit/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: JavaScript and auth contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check auth.js
          node --check learning.js
      - name: Run auth contract tests
        run: node --test tests/*.test.cjs
