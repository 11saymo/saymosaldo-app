name: Validate release

on:
  push:
    branches: [main, launch-hardening, auth-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app security and metadata
        run: python3 scripts/validate_release.py
      - name: Check inline JavaScript syntax
        run: |
          for file in /tmp/saymosaldo-inline-*.js; do
            node --check "$file"
          done
          node --check learning.js
          node --check currency.js
          node --check sw.js
      - name: Test local data persistence
        run: node scripts/test_storage.js
      - name: Test currency conversion and savings projections
        run: node scripts/test_features.js
      - name: Check authentication JavaScript syntax
        run: node --check auth.js
      - name: Set up Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check username authentication Edge Function
        run: deno check supabase/functions/username-auth/index.ts
      - name: Test authentication client and account isolation
        run: node scripts/test_auth.js
