name: Validate release

on:
  push:
    branches: [main, launch-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app security and metadata
        run: python3 scripts/validate_release.py
      - name: Check inline JavaScript syntax
        run: |
          for file in /tmp/saymosaldo-inline-*.js; do
            node --check "$file"
          done
          node --check sw.js
      - name: Test local data persistence
        run: node scripts/test_storage.js
