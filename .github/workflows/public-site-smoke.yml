name: MUNORA public-site smoke test

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    name: Check live MUNORA website
    runs-on: ubuntu-latest
    steps:
      - name: Allow GitHub Pages to finish publishing
        if: github.event_name == 'push'
        shell: bash
        run: sleep 45
      - name: Diagnose public DNS and HTTP routing
        shell: bash
        run: |
          set -u
          echo "A records for munora.ru:"
          dig +short A munora.ru || true
          echo "AAAA records for munora.ru:"
          dig +short AAAA munora.ru || true
          echo "CAA records for munora.ru:"
          dig +short CAA munora.ru || true
          echo "www records:"
          dig +noall +answer www.munora.ru A www.munora.ru AAAA www.munora.ru CNAME || true
          echo "HTTP response headers:"
          curl --silent --show-error --location --max-time 20 -I http://munora.ru/ || true
      - name: Check homepage, auth entry point, and security policy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 30 https://munora.ru/ -o /tmp/munora.html
          grep -Fq 'https://munora.ru/' /tmp/munora.html
          grep -Fq 'id="googleSignInButton"' /tmp/munora.html
          grep -Fq "object-src 'none'" /tmp/munora.html
          grep -Fq "frame-src 'none'" /tmp/munora.html
          grep -Fq './auth.js' /tmp/munora.html
      - name: Check legal pages and service worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 30 https://munora.ru/privacy.html -o /tmp/munora-privacy.html
          curl --fail --silent --show-error --location --retry 3 --max-time 30 https://munora.ru/terms.html -o /tmp/munora-terms.html
          curl --fail --silent --show-error --location --retry 3 --max-time 30 https://munora.ru/sw.js -o /tmp/munora-sw.js
          curl --fail --silent --show-error --location --retry 3 --max-time 30 https://munora.ru/robots.txt -o /tmp/munora-robots.txt
          curl --fail --silent --show-error --location --retry 3 --max-time 30 https://munora.ru/sitemap.xml -o /tmp/munora-sitemap.xml
          curl --fail --silent --show-error --location --retry 3 --max-time 30 https://munora.ru/.well-known/security.txt -o /tmp/munora-security.txt
          grep -Fq 'Политика конфиденциальности' /tmp/munora-privacy.html
          grep -Fq 'Условия использования' /tmp/munora-terms.html
          grep -Fq 'munora-v60' /tmp/munora-sw.js
          grep -Fq './terms.html' /tmp/munora-sw.js
          grep -Fq 'https://munora.ru/terms.html' /tmp/munora-sitemap.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('/tmp/munora-sitemap.xml')"
          grep -Fq 'Sitemap: https://munora.ru/sitemap.xml' /tmp/munora-robots.txt
          grep -Fq 'Contact: mailto:should.poject@gmail.com' /tmp/munora-security.txt
          grep -Fq 'isAuthCallback' /tmp/munora-sw.js
