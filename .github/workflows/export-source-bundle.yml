name: Export MUNORA source bundle

on:
  push:
    branches:
      - export/munora-source-bundle

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create export note and ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > EXPORT_README.txt <<'EOF'
          MUNORA — project source bundle

          This archive contains the tracked project files from the Git commit
          used by the export workflow: website HTML, CSS, JavaScript, images,
          icons, PWA assets, Supabase function and migration source, tests,
          project documentation, and GitHub workflow configuration.

          This is a source-code snapshot, not a full infrastructure backup.
          It does not contain the live Supabase database, user records,
          OAuth client secrets, service-role keys, passwords, private
          environment variables, or account ownership / access credentials.

          Before transferring the project to a buyer, separately arrange
          ownership transfer and secure rotation of all infrastructure secrets.
          EOF

          echo "Source commit: $(git rev-parse HEAD)" >> EXPORT_README.txt
          zip -qr dist/MUNORA_source_bundle.zip . \
            -x './.git/*' \
               './dist/*' \
               './.github/workflows/export-source-bundle.yml' \
               './.env' './.env.*' '*/.env' '*/.env.*' \
               '*.pem' '*.key' '*.p12' '*.pfx' \
               '*/id_rsa' '*/id_rsa.*' \
               '*/credentials*.json' '*/service-account*.json' \
               '*.sqlite' '*.sqlite3' '*.db'

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: munora-source-bundle
          path: dist/MUNORA_source_bundle.zip
          if-no-files-found: error
          retention-days: 1
